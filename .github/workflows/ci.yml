name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The images the tempo repo's Docker Build workflow publishes, rather than a branch of
  # anyone's fork. Bump the tag to the release being tested.
  TEMPO_IMAGE: ghcr.io/nvnm-chain/tempo
  TEMPO_XTASK_IMAGE: ghcr.io/nvnm-chain/tempo-xtask
  TEMPO_TAG: sha-cb8ce92

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras

      # The node is the image the tempo repo publishes, so the suite runs what a validator
      # runs. Only the two binaries come out of it: the harness launches the node itself,
      # and needs tempo-xtask on the host because the hardfork tests generate their own
      # genesis to schedule a fork past block 0.
      # Not cached: the image is 390 MB to pull and the binaries are 1.3 GB unstripped, so
      # a cache round trip costs more than fetching them again.
      - name: Take the binaries out of the published images
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/tempo"
          mkdir -p "$dir"
          for image in "$TEMPO_IMAGE" "$TEMPO_XTASK_IMAGE"; do
            bin="${image##*/}"
            docker pull "$image:$TEMPO_TAG"
            id="$(docker create "$image:$TEMPO_TAG")"
            docker cp "$id:/usr/local/bin/$bin" "$dir/$bin"
            docker rm "$id" > /dev/null
          done

      - name: Point the harness at the node + genesis
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/tempo"
          chmod +x "$dir/tempo" "$dir/tempo-xtask"
          "$dir/tempo" --version
          echo "TEMPO_BIN=$dir/tempo" >> "$GITHUB_ENV"
          echo "TEMPO_XTASK_BIN=$dir/tempo-xtask" >> "$GITHUB_ENV"
          # No TEMPO_GENESIS: the harness generates one per run with xtask. The fork tests
          # need a schedule past block 0, which a prebuilt genesis cannot carry.

      # The dev-node tests only; the consensus localnet needs a multi-validator cluster
      # this job does not stand up (run those locally).
      - name: Test
        run: uv run --all-extras pytest -m "not consensus"
