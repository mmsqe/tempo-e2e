name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The anchoring precompile is not in upstream tempo
  TEMPO_REPO: mmsqe/tempo
  TEMPO_REF: main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Resolve the tempo revision
        id: tempo
        run: |
          set -euo pipefail
          sha=$(git ls-remote "https://github.com/$TEMPO_REPO" "refs/heads/$TEMPO_REF" | cut -f1)
          [ -n "$sha" ] || { echo "no such branch: $TEMPO_REPO@$TEMPO_REF" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tempo node: $TEMPO_REPO@$TEMPO_REF ($sha)"

      # Keyed on the node revision, so the build only reruns when that branch moves.
      - name: Restore the tempo node binary
        id: tempo-bin
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/tempo/tempo
            ${{ runner.temp }}/tempo/tempo-xtask
          key: tempo-bins-${{ runner.os }}-${{ steps.tempo.outputs.sha }}

      # Published per commit on main by tempo's ci-bins workflow. A miss is routine -- the
      # build may still be running, or the asset may have been pruned -- so fall through
      # to the source build rather than failing.
      - name: Download the prebuilt tempo node binaries
        id: tempo-dl
        if: steps.tempo-bin.outputs.cache-hit != 'true'
        env:
          SHA: ${{ steps.tempo.outputs.sha }}
        run: |
          set -uo pipefail
          url="https://github.com/$TEMPO_REPO/releases/download/ci-bins/tempo-bins-$SHA-x86_64-linux.tar.gz"
          mkdir -p "$RUNNER_TEMP/tempo"
          # Bare --retry so a 404, the ordinary "not built yet", fails fast instead of
          # backing off. Extracting inside the condition keeps a truncated tarball from
          # reaching the suite.
          if curl -fsSL --retry 3 -o "$RUNNER_TEMP/bins.tar.gz" "$url" \
            && tar -xzf "$RUNNER_TEMP/bins.tar.gz" -C "$RUNNER_TEMP/tempo"; then
            echo "downloaded=true" >> "$GITHUB_OUTPUT"
            echo "using prebuilt binaries for $SHA"
          else
            echo "downloaded=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no prebuilt binaries for $SHA; building from source"
          fi

      - name: Check out the tempo node
        if: steps.tempo-bin.outputs.cache-hit != 'true' && steps.tempo-dl.outputs.downloaded != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TEMPO_REPO }}
          ref: ${{ steps.tempo.outputs.sha }}
          path: tempo-src

      - uses: dtolnay/rust-toolchain@stable
        if: steps.tempo-bin.outputs.cache-hit != 'true' && steps.tempo-dl.outputs.downloaded != 'true'

      # Linking a reth-derived binary with GNU ld costs minutes; tempo's own CI uses mold.
      - uses: rui314/setup-mold@v1
        if: steps.tempo-bin.outputs.cache-hit != 'true' && steps.tempo-dl.outputs.downloaded != 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.tempo-bin.outputs.cache-hit != 'true' && steps.tempo-dl.outputs.downloaded != 'true'
        with:
          workspaces: tempo-src

      # Default features only: the image's asm-keccak/jemalloc/otlp are perf and
      # observability knobs the harness does not need. tempo-xtask comes along because
      # the hardfork tests generate their own genesis to schedule a fork past block 0 --
      # a prebuilt one cannot express that.
      - name: Build the tempo node binaries
        if: steps.tempo-bin.outputs.cache-hit != 'true' && steps.tempo-dl.outputs.downloaded != 'true'
        working-directory: tempo-src
        env:
          # Even with every dependency cached, release's thin LTO plus the link was 10m15s
          # of an 11m38s build here. The harness needs a correct node, not a fast one.
          # ci-bins sets the same overrides so both paths agree.
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "256"
        run: |
          set -euo pipefail
          cargo build --release --bin tempo --bin tempo-xtask
          mkdir -p "$RUNNER_TEMP/tempo"
          cp target/release/tempo target/release/tempo-xtask "$RUNNER_TEMP/tempo/"

      - name: Point the harness at the node + genesis
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/tempo"
          chmod +x "$dir/tempo" "$dir/tempo-xtask"
          "$dir/tempo" --version
          echo "TEMPO_BIN=$dir/tempo" >> "$GITHUB_ENV"
          echo "TEMPO_XTASK_BIN=$dir/tempo-xtask" >> "$GITHUB_ENV"
          # No TEMPO_GENESIS: the harness generates one per run with xtask. The fork tests
          # need a schedule past block 0, which a prebuilt genesis cannot carry.

      # The dev-node tests only; the consensus localnet needs a multi-validator cluster
      # this job does not stand up (run those locally).
      - name: Test
        run: uv run --all-extras pytest -m "not consensus"
